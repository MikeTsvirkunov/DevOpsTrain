    - name: Развертывание демонстрационного приложения - Создайте объект Application, который свяжет Git-репозиторий с кластером
      ansible.builtin.copy:
        dest: /tmp/guestbook-app.yaml
        content: |
          apiVersion: argoproj.io/v1alpha1
          kind: Application
          metadata:
            name: guestbook
            namespace: argocd
          spec:
            project: default
            source:
              repoURL: https://github.com/argoproj/argocd-example-apps.git
              targetRevision: HEAD
              path: guestbook
            destination:
              server: https://kubernetes.default.svc
              namespace: default
            syncPolicy:
              automated:
                prune: true
                selfHeal: true
        mode: '0644'
      run_once: true

    - name: Развертывание демонстрационного приложения - Применение манифеста через kubectl
      ansible.builtin.command: kubectl apply -f /tmp/guestbook-app.yaml
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      register: apply_result
      changed_when: "'created' in apply_result.stdout or 'configured' in apply_result.stdout"
      run_once: true


    - name: Делаем сервис guestbook-ui доступным снаружи через NodePort
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Service
          metadata:
            name: guestbook-ui
            namespace: default
          spec:
            type: NodePort
            ports:
              - port: 80
                targetPort: 80
                nodePort: 30081
                protocol: TCP
            selector:
              app: guestbook-ui
        kubeconfig: "{{ kubeconfig }}"
        merge_type: merge
      run_once: true

