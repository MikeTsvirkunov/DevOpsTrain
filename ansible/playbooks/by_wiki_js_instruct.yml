---
- name: 1. Настройка k3s Server (Control Plane)
  hosts: k3s_servers
  become: true
  gather_facts: false
  tasks:
    - name: Проверка, установлен ли k3s
      ansible.builtin.stat:
        path: /usr/local/bin/k3s
      register: k3s_bin

    - name: Установка k3s Server
      ansible.builtin.shell: |
        curl -sfL https://get.k3s.io | sh -s - --node-external-ip {{ inventory_hostname }}
      args:
        creates: /usr/local/bin/k3s
      when: not k3s_bin.stat.exists

    - name: Запуск и автозагрузка службы k3s
      ansible.builtin.service:
        name: k3s
        state: started
        enabled: yes

    - name: Чтение токена для присоединения нод
      ansible.builtin.command: cat /var/lib/rancher/k3s/server/node-token
      register: k3s_token_cmd
      changed_when: false
      run_once: true

    - name: Распространение токена в факты плейбука
      ansible.builtin.set_fact:
        k3s_node_token: "{{ k3s_token_cmd.stdout | trim }}"
      run_once: true



- name: 2. Настройка k3s Agents (Workers)
  hosts: k3s_agents
  become: true
  gather_facts: false
  tasks:
    - name: Проверка, установлен ли k3s
      ansible.builtin.stat:
        path: /usr/local/bin/k3s
      register: k3s_bin
      run_once: true

    - name: Установка k3s Agent
      ansible.builtin.shell: |
        curl -sfL https://get.k3s.io | K3S_URL=https://192.168.0.15:6443 K3S_TOKEN={{ hostvars[groups['k3s_servers'][0]]['k3s_node_token'] }} sh -
      args:
        creates: /usr/local/bin/k3s
      when: not k3s_bin.stat.exists
      run_once: true

    - name: Запуск и автозагрузка службы k3s-agent
      ansible.builtin.service:
        name: k3s-agent
        state: started
        enabled: yes
      run_once: true


- name: 3. Установка ArgoCD via kubernetes.core.k8s
  hosts: k3s_servers
  become: true
  gather_facts: false
  vars:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
  tasks:
    - name: Install pip for Python 3
      ansible.builtin.apt:
        name: python3-pip
        update_cache: yes
        state: present
      become: true
      run_once: true
    - name: Устанавливаем необходимые Python-библиотеки для k8s модуля
      ansible.builtin.pip:
        name:
          - kubernetes
          - openshift
        executable: pip3
        state: present
      run_once: true

    - name: Ожидание готовности API-сервера k3s
      ansible.builtin.command: kubectl get nodes
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      register: k3s_api_ready
      until: k3s_api_ready.rc == 0
      retries: 30
      delay: 180
      timeout: 200
      changed_when: false
      run_once: true

    - name: Создание namespace argocd
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: argocd
            labels:
              name: argocd
        kubeconfig: "{{ kubeconfig }}"
      run_once: true

    - name: Download a file from a URL
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
        dest: /tmp/github-argocd-install.yaml
        mode: '0644'
      run_once: true

    - name: Применение манифеста ArgoCD
      ansible.builtin.command: kubectl apply -n argocd --server-side --force-conflicts -f /tmp/github-argocd-install.yaml
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      register: argocd_apply
      changed_when: "'created' in argocd_apply.stdout or 'configured' in argocd_apply.stdout"
      timeout: 120
      run_once: true
    
    - name: Ожидание готовности подов ArgoCD Server
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        namespace: argocd
        label_selectors:
          - app.kubernetes.io/name=argocd-server
        kubeconfig: "{{ kubeconfig }}"
      register: argocd_pods
      until: >
        (argocd_pods.resources | default([])) | 
        selectattr('status.phase', 'equalto', 'Running') | 
        list | length > 0 
      retries: 60
      delay: 10
      run_once: true

    - name: Перевод сервиса argocd-server на LoadBalancer/NodePort для External IP
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Service
          metadata:
            name: argocd-server
            namespace: argocd
          spec:
            type: NodePort
            ports:
              - name: http
                port: 80
                targetPort: 8080
                nodePort: 30080
                protocol: TCP
              - name: https
                port: 443
                targetPort: 8080
                protocol: TCP
            selector:
              app.kubernetes.io/name: argocd-server
        kubeconfig: "{{ kubeconfig }}"
        merge_type: merge
      run_once: true


    - name: Получение External IP из ноды (для NodePort)
      ansible.builtin.set_fact:
        argocd_external_ip: "{{ inventory_hostname }}"
        argocd_url: "http://{{ inventory_hostname }}:30080"
      run_once: true

 
    - name: Развертывание демонстрационного приложения - Создайте объект Application, который свяжет Git-репозиторий с кластером
      ansible.builtin.copy:
        dest: /tmp/guestbook-app.yaml
        content: |
          apiVersion: argoproj.io/v1alpha1
          kind: Application
          metadata:
            name: guestbook
            namespace: argocd
          spec:
            project: default
            source:
              repoURL: https://github.com/argoproj/argocd-example-apps.git
              targetRevision: HEAD
              path: guestbook
            destination:
              server: https://kubernetes.default.svc
              namespace: default
            syncPolicy:
              automated:
                prune: true
                selfHeal: true
        mode: '0644'
      run_once: true

    - name: Развертывание демонстрационного приложения - Применение манифеста через kubectl
      ansible.builtin.command: kubectl apply -f /tmp/guestbook-app.yaml
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      register: apply_result
      changed_when: "'created' in apply_result.stdout or 'configured' in apply_result.stdout"
      run_once: true


    - name: Делаем сервис guestbook-ui доступным снаружи через NodePort
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Service
          metadata:
            name: guestbook-ui
            namespace: default
          spec:
            type: NodePort
            ports:
              - port: 80
                targetPort: 80
                nodePort: 30081
                protocol: TCP
            selector:
              app: guestbook-ui
        kubeconfig: "{{ kubeconfig }}"
        merge_type: merge
      run_once: true


- name: 4. Установка ClearML via Helm
  hosts: k3s_servers
  become: true
  gather_facts: false
  vars:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
  tasks:
    - name: Установка Helm 3
      ansible.builtin.shell: |
        curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      args:
        creates: /usr/local/bin/helm
      run_once: true

    - name: Добавление Helm-репозитория ClearML
      ansible.builtin.command: helm repo add clearml https://clearml.github.io/clearml-helm-charts --force-update
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      register: helm_repo_add
      changed_when: "'has been added' in helm_repo_add.stdout"
      run_once: true

    - name: Обновление Helm-репозиториев
      ansible.builtin.command: helm repo update
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      run_once: true

    - name: Развертывание ClearML через Helm
      ansible.builtin.command: >
        helm upgrade --install clearml clearml/clearml 
        --namespace clearml --create-namespace 
        --set apiserver.service.nodePort=30008 
        --set fileserver.service.nodePort=30082 
        --set webserver.service.nodePort=30083
        --wait --timeout 15m
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      register: helm_install
      changed_when: "'STATUS: deployed' in helm_install.stdout"
      timeout: 1000
      run_once: true

    - name: Вывод URL-адресов ClearML
      ansible.builtin.debug:
        msg:
          - "ClearML Web Server UI: http://{{ inventory_hostname }}:30083"
          - "ClearML API Server: http://{{ inventory_hostname }}:30008"
          - "ClearML File Server: http://{{ inventory_hostname }}:30082"
      run_once: true