---
- name: Install k3s on main server (control plane)
  hosts: main
  become: yes
  tasks:
    - name: Install k3s server
      shell: |
        curl -sfL https://get.k3s.io | sh -s - server --write-kubeconfig-mode 644
      args:
        creates: /usr/local/bin/k3s

    - name: Get node token
      slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: node_token

    - name: Set token as fact
      set_fact:
        k3s_token: "{{ node_token.content | b64decode | trim }}"
        cacheable: yes

- name: Install k3s on worker node and join cluster
  hosts: worker
  become: yes
  vars:
    main_ip: "{{ hostvars['main-server']['ansible_host'] }}"
    k3s_token: "{{ hostvars['main-server']['k3s_token'] }}"
  tasks:
    - name: Join k3s worker
      shell: |
        curl -sfL https://get.k3s.io | K3S_URL=https://{{ main_ip }}:6443 K3S_TOKEN={{ k3s_token }} sh -
      args:
        creates: /usr/local/bin/k3s

- name: Install ArgoCD on the cluster
  hosts: main
  become: yes
  tasks:
    - name: Create argocd namespace
      shell: kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -

    - name: Install ArgoCD
      shell: |
        kubectl apply -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml

    - name: Wait for ArgoCD server to be ready
      shell: |
        kubectl wait --for=condition=available --timeout=300s deployment/argocd-server -n argocd
      register: result
      retries: 6
      delay: 10
      until: result is success

    - name: Get initial ArgoCD admin password
      shell: |
        kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath="{.data.password}" | base64 -d
      register: argocd_password
      changed_when: false

    - name: Display ArgoCD admin password
      debug:
        msg: "ArgoCD admin password: {{ argocd_password.stdout }}"