---
# playbook.yml
# Запуск: ansible-playbook -i inventory.ini playbook.yml

- name: 1. Настройка k3s Server (Control Plane)
  hosts: k3s_servers
  become: true
  gather_facts: false
  tasks:
    - name: Проверка, установлен ли k3s
      ansible.builtin.stat:
        path: /usr/local/bin/k3s
      register: k3s_bin

    - name: Установка k3s Server
      ansible.builtin.shell: |
        curl -sfL https://get.k3s.io | sh -
      args:
        creates: /usr/local/bin/k3s
      when: not k3s_bin.stat.exists

    - name: Запуск и автозагрузка службы k3s
      ansible.builtin.service:
        name: k3s
        state: started
        enabled: yes

    - name: Чтение токена для присоединения нод
      ansible.builtin.command: cat /var/lib/rancher/k3s/server/node-token
      register: k3s_token_cmd
      changed_when: false
      run_once: true

    - name: Распространение токена в факты плейбука
      ansible.builtin.set_fact:
        k3s_node_token: "{{ k3s_token_cmd.stdout | trim }}"
      run_once: true

- name: 2. Настройка k3s Agents (Workers)
  hosts: k3s_agents
  become: true
  gather_facts: false
  tasks:
    - name: Проверка, установлен ли k3s
      ansible.builtin.stat:
        path: /usr/local/bin/k3s
      register: k3s_bin

    - name: Установка k3s Agent
      ansible.builtin.shell: |
        curl -sfL https://get.k3s.io | K3S_URL=https://{{ groups['k3s_servers'][0] }}:6443 K3S_TOKEN={{ hostvars[groups['k3s_servers'][0]]['k3s_node_token'] }} sh -
      args:
        creates: /usr/local/bin/k3s
      when: not k3s_bin.stat.exists

    - name: Запуск и автозагрузка службы k3s-agent
      ansible.builtin.service:
        name: k3s-agent
        state: started
        enabled: yes

- name: 3. Установка ArgoCD в кластер
  hosts: k3s_servers
  become: true
  gather_facts: false
  tasks:
    - name: Ожидание готовности API-сервера k3s
      ansible.builtin.command: kubectl get nodes
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      register: k3s_api_ready
      until: k3s_api_ready.rc == 0
      retries: 30
      delay: 180
      timeout: 45
      changed_when: false
      run_once: true

    - name: Создание namespace argocd
      ansible.builtin.command: kubectl create namespace argocd
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      register: ns_result
      changed_when: "'created' in ns_result.stdout"
      failed_when: ns_result.rc != 0 and 'AlreadyExists' not in ns_result.stderr
      run_once: true

    - name: Скачивание манифеста ArgoCD на сервер
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
        dest: /tmp/argocd-install.yaml
        mode: '0644'
      run_once: true

    - name: Применение манифеста ArgoCD
      ansible.builtin.command: kubectl apply -n argocd --server-side --force-conflicts -f /tmp/argocd-install.yaml
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      register: argocd_apply
      changed_when: "'created' in argocd_apply.stdout or 'configured' in argocd_apply.stdout"
      timeout: 120
      run_once: true

    - name: Ожидание готовности ArgoCD Server
      ansible.builtin.command: >
        kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=argocd-server -n argocd --timeout=300s
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      changed_when: false
      run_once: true

    # >>> НОВЫЕ ЗАДАЧИ: Экспозиция ArgoCD UI на порту 7998 <<<
    - name: Изменение сервиса ArgoCD на LoadBalancer с портом 7998 (k3s ServiceLB)
      ansible.builtin.shell: |
        kubectl patch service argocd-server -n argocd --type merge -p '
        {
          "spec": {
            "type": "LoadBalancer",
            "ports": [
              {
                "name": "http",
                "port": 7998,
                "targetPort": 8080,
                "protocol": "TCP"
              },
              {
                "name": "https",
                "port": 8443,
                "targetPort": 8080,
                "protocol": "TCP"
              }
            ]
          }
        }'
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      run_once: true
      register: patch_result
      changed_when: "'service/argocd-server patched' in patch_result.stdout"

    - name: Ожидание назначенияEXTERNAL-IP для сервиса ArgoCD
      ansible.builtin.command: >
        kubectl get svc argocd-server -n argocd -o jsonpath='{.status.loadBalancer.ingress[0].ip}'
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      register: lb_ip
      until: lb_ip.stdout != ""
      retries: 30
      delay: 10
      changed_when: false
      run_once: true
      ignore_errors: true

    - name: Показать информацию о доступе к ArgoCD
      ansible.builtin.debug:
        msg: |
          ✅ ArgoCD UI доступен:
          🔹 Адрес: {{ 'http://' + (lb_ip.stdout | default(groups['k3s_servers'][0])) + ':7998' }}
          🔹 Логин: admin
          🔹 Пароль: получите командой:
             kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath="{.data.password}" | base64 -d
          ⚠️  Если используется фаервол, убедитесь, что порт 7998 открыт.
      run_once: true