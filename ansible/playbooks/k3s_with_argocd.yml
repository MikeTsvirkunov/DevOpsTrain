---
- name: Install k3s on master node
  hosts: masters
  become: yes
  vars:
    k3s_version: "v1.28.2+k3s1"
    argocd_version: "v2.9.3"
  tasks:
    - name: Install k3s via official script
      shell: |
        curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION="{{ k3s_version }}" sh -
      args:
        creates: /usr/local/bin/k3s
    - name: Wait for node to be ready
      shell: kubectl get nodes
      register: kubectl_output
      until: kubectl_output.rc == 0
      retries: 10
      delay: 5
    - name: Fetch kubeconfig
      fetch:
        src: /etc/rancher/k3s/k3s.yaml
        dest: ./kubeconfig
        flat: yes
      when: inventory_hostname == groups['masters'][0]  # берём с первой мастер-ноды

- name: Install ArgoCD on k3s cluster
  hosts: localhost
  connection: local
  vars:
    argocd_version: "v2.9.3"
  tasks:
    - name: Create namespace for ArgoCD
      kubernetes.core.k8s:
        name: argocd
        api_version: v1
        kind: Namespace
        state: present
        kubeconfig: ./kubeconfig
    - name: Apply ArgoCD manifests
      kubernetes.core.k8s:
        src: "https://raw.githubusercontent.com/argoproj/argo-cd/{{ argocd_version }}/manifests/install.yaml"
        state: present
        kubeconfig: ./kubeconfig
    - name: Wait for ArgoCD server pod
      kubernetes.core.k8s_info:
        kind: Pod
        namespace: argocd
        label_selectors:
          - app.kubernetes.io/name = argocd-server
        kubeconfig: ./kubeconfig
      register: argocd_pods
      until: argocd_pods.resources | length > 0 and argocd_pods.resources[0].status.phase == "Running"
      retries: 20
      delay: 10
    - name: Get ArgoCD admin initial password
      kubernetes.core.k8s_info:
        kind: Secret
        namespace: argocd
        name: argocd-initial-admin-secret
        kubeconfig: ./kubeconfig
      register: argocd_secret
    - name: Display ArgoCD admin password
      debug:
        msg: "ArgoCD admin password: {{ argocd_secret.resources[0].data.password | b64decode }}"