---
- name: Deploy k3s cluster and ArgoCD
  hosts: all
  gather_facts: true
  vars:
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'

  tasks:
    - name: Install required system packages
      ansible.builtin.apt:
        name:
          - curl
          - apt-transport-https
          - ca-certificates
          - gnupg
          - lsb-release
        state: present
        update_cache: yes

    # ---------- Master / Server ----------
    - block:
        - name: Check if k3s is already installed on master
          stat:
            path: /etc/rancher/k3s/k3s.yaml
          register: k3s_master_config

        - name: Install k3s server
          shell: |
            curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC="server --node-ip {{ ansible_default_ipv4.address }} --write-kubeconfig-mode 644" sh -
          when: not k3s_master_config.stat.exists

        - name: Wait for k3s server to be ready
          wait_for:
            path: /etc/rancher/k3s/k3s.yaml
            timeout: 60
          when: not k3s_master_config.stat.exists

        - name: Read node token from master
          slurp:
            src: /var/lib/rancher/k3s/server/node-token
          register: k3s_token_raw

        - name: Set cluster token as fact for all hosts
          set_fact:
            k3s_cluster_token: "{{ k3s_token_raw.content | b64decode | trim }}"
      when: inventory_hostname in groups['master']

    # ---------- Worker / Agent ----------
    - block:
        - name: Check if k3s agent is already joined
          stat:
            path: /etc/rancher/k3s/k3s.yaml
          register: k3s_agent_config

        - name: Install k3s agent and join cluster
          shell: |
            curl -sfL https://get.k3s.io | K3S_URL=https://{{ hostvars[groups['master'][0]]['ansible_default_ipv4']['address'] }}:6443 \
            K3S_TOKEN={{ hostvars[groups['master'][0]]['k3s_cluster_token'] }} \
            INSTALL_K3S_EXEC="agent --node-ip {{ ansible_default_ipv4.address }}" sh -
          when: not k3s_agent_config.stat.exists
      when: inventory_hostname in groups['worker']

    # ---------- ArgoCD installation (run on master) ----------
    - block:
        - name: Wait for worker node to appear in cluster
          shell: |
            kubectl --kubeconfig /etc/rancher/k3s/k3s.yaml get nodes -o json | jq -r '.items[] | select(.status.addresses[] | select(.type=="InternalIP") | .address == "{{ hostvars[groups['worker'][0]]['ansible_default_ipv4']['address'] }}") | .metadata.name'
          register: worker_node_name_cmd
          changed_when: false
          until: worker_node_name_cmd.stdout != ""
          retries: 30
          delay: 10

        - name: Set worker node name fact
          set_fact:
            worker_node_name: "{{ worker_node_name_cmd.stdout }}"

        - name: Label worker node for ArgoCD
          command: >
            kubectl --kubeconfig /etc/rancher/k3s/k3s.yaml label node {{ worker_node_name }}
            argocd-role=server --overwrite
          ignore_errors: true

        - name: Check if ArgoCD is already installed
          stat:
            path: /tmp/argocd_installed.flag
          register: argocd_flag

        - name: Install ArgoCD
          block:
            - name: Create argocd namespace
              shell: |
                kubectl --kubeconfig /etc/rancher/k3s/k3s.yaml create namespace argocd --dry-run=client -o yaml | kubectl apply -f -

            - name: Apply ArgoCD manifests
              shell: |
                kubectl --kubeconfig /etc/rancher/k3s/k3s.yaml apply -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml

            - name: Patch argocd-server deployment with nodeSelector
              command: >
                kubectl --kubeconfig /etc/rancher/k3s/k3s.yaml patch deployment argocd-server -n argocd
                -p '{"spec":{"template":{"spec":{"nodeSelector":{"argocd-role":"server"}}}}}'
              ignore_errors: true

            - name: Wait for argocd-server rollout
              command: >
                kubectl --kubeconfig /etc/rancher/k3s/k3s.yaml rollout status deployment argocd-server -n argocd --timeout=300s
              register: rollout
              until: rollout.rc == 0
              retries: 30
              delay: 10
              ignore_errors: true

            - name: Mark ArgoCD as installed
              file:
                path: /tmp/argocd_installed.flag
                state: touch
          when: not argocd_flag.stat.exists
      when: inventory_hostname in groups['master']