name: CI

on: [push]

jobs:
  opentofu_run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.ref }}
    
    
    - uses: opentofu/setup-opentofu@v2
    - name: Checking
      run: ls -a
    - name: Tofu initiation
      working-directory: ./simple_example
      run: |
        export TWC_TOKEN=${{ secrets.TWC_TOKEN }}
        export TF_VAR_image_id='ami-abc123'
        export TOFU_LOG=DEBUG
        export TF_LOG=TRACE
        tofu init -upgrade
        tofu plan -no-color
        tofu apply -auto-approve -lock-timeout=360s
