name: CI

on: [push]

jobs:
  opentofu_run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.ref }}
    
    
    - uses: opentofu/setup-opentofu@v2
    - name: Checking
      run: ls -a
    - name: Tofu initiation
      working-directory: ./simple_example
      run: |
        export TWC_TOKEN=${{ secrets.TWC_TOKEN }}
        export TF_REGISTRY_CLIENT_TIMEOUT=240
        tofu init -upgrade
        tofu plan -no-color
        tofu apply -auto-approve
        echo ${{ steps.plan.outputs.stdout }}
        echo ${{ steps.plan.outputs.stderr }}
        echo ${{ steps.plan.outputs.exitcode }}
