name: CI

on: [push]

jobs:
  opentofu_run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.ref }}
    
    
    - uses: opentofu/setup-opentofu@v2
    - name: Checking
      run: ls -a
    - name: Tofu initiation
      working-directory: ./
      env:
        TWC_TOKEN: ${{ secrets.TWC_TOKEN }}
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
      run: |
        export OPENTOFU_WORKING_DIR=${{vars.OPENTOFU_WORKUNG_DIR}}
        export TF_VAR_image_id='ami-abc123'
        export TOFU_LOG=DEBUG
        export TF_LOG=TRACE
    - name: Tofu build
      working-directory: ./
      run: |
        tofu -chdir="$OPENTOFU_WORKING_DIR" init -upgrade -backend-config="backend=$S3_BUCKET_NAME"
        tofu -chdir="$OPENTOFU_WORKING_DIR" plan -no-color
        tofu -chdir="$OPENTOFU_WORKING_DIR" apply -auto-approve -lock-timeout=360s
        tofu -chdir="$OPENTOFU_WORKING_DIR" output
        tofu -chdir="$OPENTOFU_WORKING_DIR" state list | grep main-server
    - name: Export data
      working-directory: ./
      run: |
        export MAIN_IP=$(tofu output -json main_server_ip | jq -r '.')
        echo "main_ip=$MAIN_IP" >> $GITHUB_OUTPUT
        export WORKER_IP=$(tofu output -json argocd_node_ip | jq -r '.')
        echo "worker_ip=$WORKER_IP" >> $GITHUB_OUTPUT

  
  ansible_run:
    needs: opentofu_run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Check
        run: |
          echo ${{ needs.opentofu_run.outputs.main_server_ip }}
          echo $MAIN_IP
          echo ${{ needs.opentofu_run.outputs.argocd_node_ip }}
          echo $WORKER_IP
      - name: Getting IPs from OpenTofu
        id: get_ips
        run: |
          echo "main_ip=${{ needs.opentofu_run.outputs.main_server_ip }}" >> $GITHUB_OUTPUT
          echo "worker_ip=${{ needs.opentofu_run.outputs.argocd_node_ip }}" >> $GITHUB_OUTPUT
      - name: Install Ansible & Co.
        run: |
          sudo apt update
          sudo apt install -y ansible python3-pip sshpass
          pip3 install --upgrade ansible
      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY_FOR_ARGOCD_NODE_SERVER: ${{ secrets.SSH_PRIVATE_KEY_FOR_ARGOCD_NODE_SERVER }}
          SSH_PRIVATE_KEY_FOR_MAIN_SERVER: ${{ secrets.SSH_PRIVATE_KEY_FOR_MAIN_SERVER }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY_FOR_MAIN_SERVER" > ~/.ssh/main-server-ssh-key
          chmod 600 ~/.ssh/main-server-ssh-key
          echo "$SSH_PRIVATE_KEY_FOR_ARGOCD_NODE_SERVER" > ~/.ssh/argocd-node-server
          chmod 600 ~/.ssh/argocd-node-server
          echo "Host *" > ~/.ssh/config
          echo "  StrictHostKeyChecking no" >> ~/.ssh/config
          echo "  UserKnownHostsFile=/dev/null" >> ~/.ssh/config
          echo "  User root" >> ~/.ssh/config
      - name: Init inventory
        env:
          MAIN_IP: ${{ needs.opentofu_run.outputs.main_server_ip }}
          WORKER_IP: ${{ needs.opentofu_run.outputs.argocd_node_ip }}
        run: |
          python3 scripts/generate_inventory.py \
            --master "$MAIN_IP" \
            --worker "$WORKER_IP" \
            --output inventory.ini
          cat inventory.ini 