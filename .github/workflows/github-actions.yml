name: CI

on: [push]

jobs:
  opentofu_run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.ref }}
    
    
    - uses: opentofu/setup-opentofu@v2
    - name: Checking
      run: ls -a
    - name: Tofu initiation
      working-directory: ./
      env:
        TWC_TOKEN: ${{ secrets.MMM_TWC_TOKEN }}
      run: |
        export OPENTOFU_WORKING_DIR=${{vars.OPENTOFU_WORKUNG_DIR}}
        export TF_VAR_image_id='ami-abc123'
        export TOFU_LOG=DEBUG
        export TF_LOG=TRACE
        tofu -chdir="$OPENTOFU_WORKING_DIR" init -upgrade
        tofu -chdir="$OPENTOFU_WORKING_DIR" plan -no-color
        tofu -chdir="$OPENTOFU_WORKING_DIR" apply -auto-approve -lock-timeout=360s
        