name: CI

on: [push]

jobs:
  opentofu_run:
    outputs:
      main_ip: ${{ steps.tofu_init.outputs.main_ip }}
      worker_ip: ${{ steps.tofu_init.outputs.worker_ip }}
      argocd_node_server_root_pw: ${{ steps.tofu_init.outputs.argocd_node_server_root_pw }}
      main_server_root_pw: ${{ steps.tofu_init.outputs.main_server_root_pw }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.ref }}
    - uses: opentofu/setup-opentofu@v2
    - name: Checking
      run: ls -a
    - name: Tofu initiation
      id: tofu_init
      env:
        TWC_TOKEN: ${{ secrets.TWC_TOKEN }}
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
        OPENTOFU_WORKING_DIR: ${{vars.OPENTOFU_WORKUNG_DIR}}
      working-directory: ./
      run: |
        tofu version
        export TF_VAR_image_id='ami-abc123'
        export TOFU_LOG=DEBUG
        export TF_LOG=TRACE
        tofu -chdir="$OPENTOFU_WORKING_DIR" init -upgrade
        tofu -chdir="$OPENTOFU_WORKING_DIR" plan -no-color
        tofu -chdir="$OPENTOFU_WORKING_DIR" apply -auto-approve -lock-timeout=360s
        tofu -chdir="$OPENTOFU_WORKING_DIR" output
        tofu -chdir="$OPENTOFU_WORKING_DIR" state list | grep main-server
        export MAIN_IP=$(tofu -chdir="${{ vars.OPENTOFU_WORKUNG_DIR }}" output -json main_server_ip | jq -r '.')
        echo $(tofu -chdir="${{ vars.OPENTOFU_WORKUNG_DIR }}" output -json main_server_ip | jq -r '.')
        export WORKER_IP=$(tofu -chdir="${{ vars.OPENTOFU_WORKUNG_DIR }}" output -json argocd_node_ip | jq -r '.')
        echo $(tofu -chdir="${{ vars.OPENTOFU_WORKUNG_DIR }}" output -json argocd_node_ip | jq -r '.')
        export MAIN_PW=$(tofu -chdir="${{ vars.OPENTOFU_WORKUNG_DIR }}" output -json main_server_root_pw | jq -r '.')
        echo $(tofu -chdir="${{ vars.OPENTOFU_WORKUNG_DIR }}" output -json main_server_root_pw | jq -r '.')
        export WORKER_PW=$(tofu -chdir="${{ vars.OPENTOFU_WORKUNG_DIR }}" output -json argocd_node_server_root_pw | jq -r '.')
        echo $(tofu -chdir="${{ vars.OPENTOFU_WORKUNG_DIR }}" output -json argocd_node_server_root_pw | jq -r '.')
        echo "main_ip=$MAIN_IP" >> $GITHUB_OUTPUT
        echo "worker_ip=$WORKER_IP" >> $GITHUB_OUTPUT
        echo "main_server_root_pw=$MAIN_PW" >> $GITHUB_OUTPUT
        echo "argocd_node_server_root_pw=$WORKER_PW" >> $GITHUB_OUTPUT

  ansible_setup:
    runs-on: ubuntu-latest
    needs: opentofu_run
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Ansible and dependencies
        run: |
          sudo apt update
          sudo apt install -y ansible sshpass
          ansible-galaxy collection install kubernetes.core
      - name: Add server keys to known_hosts
        run: |
          mkdir -p ~/.ssh
          nc -zv -w 3 ${{ needs.opentofu_run.outputs.main_ip }} 22 || echo "PORT 22 UNREACHABLE"
          MAIN_IP=$(echo "${{ needs.opentofu_run.outputs.main_ip }}" | tr -d '[:space:]')
          WORKER_IP=$(echo "${{ needs.opentofu_run.outputs.worker_ip }}" | tr -d '[:space:]')
          for i in $(seq 1 15); do
            echo "⏳ Attempt $i: checking SSH key exchange..."
            if ssh-keyscan -H -T 5 -t ed25519,rsa "$MAIN_IP" >> ~/.ssh/known_hosts 2>/dev/null; then
              echo "✅ Main IP keys added."
              break
            fi
            sleep 4
          done
          nc -zv -w 3 ${{ needs.opentofu_run.outputs.worker_ip }} 22 || echo "PORT 22 UNREACHABLE"
          for i in $(seq 1 15); do
            if ssh-keyscan -H -T 5 -t ed25519,rsa "$WORKER_IP" >> ~/.ssh/known_hosts 2>/dev/null; then
              echo "✅ Worker IP keys added."
              break
            fi
            sleep 4
          done
      - name: Create Ansible inventory
        run: |
          cat > inventory.ini << EOF
          [k3s_servers]
          ${{ needs.opentofu_run.outputs.main_ip }} ansible_user=root ansible_password='${{ needs.opentofu_run.outputs.main_server_root_pw }}'

          [k3s_agents]
          ${{ needs.opentofu_run.outputs.worker_ip }} ansible_user=root ansible_password='${{ needs.opentofu_run.outputs.argocd_node_server_root_pw }}'

          [k3s_cluster:children]
          k3s_servers
          k3s_agents

          [all:vars]
          ansible_ssh_common_args='-o StrictHostKeyChecking=no'
          ansible_become=yes
          ansible_become_method=sudo
          ansible_ssh_common_args='-o StrictHostKeyChecking=no -o ControlMaster=no -o ControlPath=none'
          
          EOF
      - name: Run k3s w ACD
        env:
          ANSIBLE_CONFIG: ansible/configs/ansible.cfg
        run: ansible-playbook ansible/playbooks/by_wiki_js_instruct.yml
      
